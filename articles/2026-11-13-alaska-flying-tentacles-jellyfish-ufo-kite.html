, altitude or identity.\n\nThe clip resurfaced in November through UFO-related social media accounts and television coverage. Some coverage suggested the object was near Joint Base Elmendorf-Richardson, but its precise location and any military connection have not been verified.\n\nAn investigation published November 13 by Alaska News reviewed the apparent viewing direction, local geography, weather observations and video frames. The report found that an octopus-shaped show kite could explain the object's shape and bobbing movement. Russian Jack Springs Park lies along the reported sightline and is used for kite flying. Wind observations from nearby airfields were compatible with kite flight.\n\nThat remains a hypothesis, not a confirmed identification. No kite operator has been identified. Osborn has questioned whether a kite could account for what she witnessed. The video alone cannot establish the object's true size or distance.\n\nThere is no verified evidence that the object was extraterrestrial or that it was linked to military activity. Further original footage, location data or independent eyewitness evidence would be needed to settle the question.\n\nSOURCE MATERIAL:\nAlaska News, Nov. 13, 2026 — https://alaskanews.com/c/alaska-news/anchorages-viral-jellyfish-ufo-was-filmed-in-june-and-it-may-be-a-kite\nIBTimes UK, Nov. 13, 2026 — https://www.ibtimes.co.uk/anchorage-jellyfish-object-ufo-octopus-kite-1832011\n\nAVQN | Truth • Voice • Impact","image":"/assets/Mysterious%20Flying%20Tentacles%20Over%20Alaska.png","date":"2026-11-13"}</script><script>const a=JSON.parse(document.getElementById('article-data').textContent),q=id=>document.getElementById(id);q('headline').textContent=a.title;q('category').textContent=a.category;q('summary').textContent=a.summary;q('body').textContent=a.body;q('byline').textContent='AVQN Newsroom · '+new Date(a.date+'T12:00:00').toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});if(a.image){q('image').src=a.ima
