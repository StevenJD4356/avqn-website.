 href="/">AVQN · TRUTH HAS VOICE</a> &nbsp; <a href="/news.html">NEWSROOM</a></header><main><div class="category" id="category"></div><h1 id="headline"></h1><div class="byline" id="byline"></div><img class="hero" id="image" hidden alt=""><p style="font-size:12px;color:#b6c1ce;margin-top:-20px">AVQN editorial graphic. AI-generated social media illustrations are labeled separately.</p><p class="summary" id="summary"></p><article class="body" id="body"></article><div class="share"><button id="copy">Copy article link</button><a id="x" target="_blank" rel="noopener">Share on X</a><a id="facebook" target="_blank" rel="noopener">Facebook</a><a id="linkedin" target="_blank" rel="noopener">LinkedIn</a><a id="whatsapp" target="_blank" rel="noopener">WhatsApp</a></div><a href="/news.html">← More AVQN stories</a></main><footer>© <span id="year"></span> Aletheia Vox Quantum Network · Truth • Voice • Impact</footer><script id="article-data" type="application/json">{"slug":"2026-11-13-faa-nationwide-ground-stop-communications-outage","title":"FAA Orders Nationwide Ground Stop After Communications Outage Disrupts U.S. Air Travel","category":"U.S. News & Transportation","summary":"A communications failure affecting 22 regional air traffic control centers prompted an FAA nationwide ground stop Friday, disrupting thousands of flights as officials investigated the cause.","body":"WASHINGTON — The Federal Aviation Administration ordered a nationwide ground stop on Friday, November 13, 2026, after a telecommunications problem disrupted communications affecting all 22 regional air traffic control centers that coordinate aircraft traveling between airports across the United States.\n\nThe FAA cited extraordinary circumstances and safety concerns in directing departing aircraft to remain on the ground. Transportation Secretary Sean Duffy said technicians were investigating the communications issue and that officials would provide updates as they became available.\n\nThe widespread disruption rapidly affected commercial air travel. According to FlightAware figures reported by Business Insider, by approximately 6:40 p.m. Eastern, more than 10,200 flights to, from, or within the United States had been delayed and more than 3,220 canceled. These figures were a point-in-time snapshot and may have changed as the situation developed.\n\nHomeland Security Secretary Markwayne Mullin said investigators had not identified evidence of a cyberattack at the time of his remarks. Officials had not established the precise cause of the outage, and reports linking the disruption to specific technology companies remained unsubstantiated. Both Microsoft and Air Space Intelligence said they had no indication their systems caused the nationwide ground stop.\n\nThe consequences extended beyond ordinary passenger travel. College and professional sports teams faced last-minute itinerary changes ahead of weekend competitions, with some teams delaying departure and others considering bus travel.\n\nThe incident also renewed attention on the country's aging air traffic control communications infrastructure. Federal modernization efforts have included replacing copper wiring and updating communications equipment, but substantial work remains.\n\nWHAT PASSENGERS SHOULD KNOW\n\nTravelers should check their airline's official app or website for current flight status before leaving for the airport. Airlines can provide information about rebooking, cancellations, and available accommodations under their applicable policies. Travelers should retain receipts for unexpected expenses and consult the U.S. Department of Transportation's airline customer-service resources for information on refunds and passenger rights.\n\nAs of this report, the underlying cause and the timeline for full restoration had not been conclusively established. AVQN will update this story as verified information becomes available.\n\nSOURCES\nAssociated Press reporting via News 12: https://bronx.news12.com/flights-halted-at-airports-across-the-us-due-to-unspecified-extraordinary-circumstances\nReuters: https://www.streetinsider.com/Reuters/FAA%2Bissues%2Bnational%2Bground%2Bstop%2Bdue%2Bto%2Bextraordinary%2Bcircumstance%2Band%2Breasons%2Bfor%2Bsafety/27343831.html\nNPR: https://www.wusf.org/2026-11-13/faa-issues-nationwide-ground-stop-for-all-u-s-airports\nBusiness Insider: https://www.businessinsider.com/smart-system-microsoft-faa-ground-stop-not-their-fault-2026-11\nAssociated Press: https://apnews.com/article/091ecf4f82a6158473357feeb05cf593","image":"/assets/faa-nationwide-ground-stop.svg","date":"2026-11-13"}</script><script>const a=JSON.parse(document.getElementById('article-data').textContent),q=id=>document.getElementById(id);q('headline').textContent=a.title;q('category').textContent=a.category;q('summary').textContent=a.summary;q('body').textContent=a.body;q('byline').textContent='AVQN Newsroom · '+new Date(a.date+'T12:00:00').toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});if(a.image){q('image').src=a.image;q('image').alt=a.title;q('image').hidden=false}q('year').textContent=new Date().getFullYear();const u=encodeURIComponent(location.href),t=encodeURIComponent(a.title);q('x').href='https://twitter.com/intent/tweet?text='+t+'&url='+u;q('facebook').href='https://www.facebook.com/sharer/sharer.php?u='+u;q('linkedin').href='https://www.linkedin.com/sharing/share-offsite/?url='+u;q('whatsapp').href='https://api.whatsapp.com/send?text='+t+'%20'+u;q('copy').onclick=()=>navigator.clipboard.writeText(location.href).then(()=>q('copy').textContent='Link copied!');</script></body></html>
