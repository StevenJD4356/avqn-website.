decision effectively halted the impeachment effort for the remainder of the current Congress.\n\nThe resolution was introduced by Republican Representative Thomas Massie of Kentucky. According to the official House Clerk's roll call, 211 lawmakers voted for the referral, 204 opposed it and 18 did not vote. Massie was the only Republican to vote against the referral. Hegseth was not impeached or removed from office.\n\nWHAT THE IMPEACHMENT RESOLUTION ALLEGED\n\nMassie's resolution presented eight articles of impeachment. It accused Hegseth of misconduct related to the U.S. war in Iran and other military operations, including disputes over congressional authorization, the handling of strikes against suspected drug-trafficking vessels, and actions involving Democratic Senator Mark Kelly of Arizona.\n\nThese are allegations advanced by a member of Congress. The House's referral vote did not determine their truth or establish that Hegseth committed impeachable misconduct.\n\nHEGSETH AND THE WHITE HOUSE RESPOND\n\nSpeaking at a Pentagon news conference before the vote, Hegseth rejected the impeachment effort as a political spectacle and defended the military operations undertaken during his tenure.\n\nThe White House also opposed the resolution, arguing in a formal November 10 statement that disagreements over military policy do not, by themselves, constitute impeachable offenses. The administration maintained that the president possesses constitutional authority to direct military operations in defense of national security.\n\nMassie and other critics disputed the administration's position on congressional war powers and the legal limits of executive action. Those constitutional disagreements remain part of the broader debate.\n\nWHAT THE HOUSE ACTUALLY VOTED ON\n\nThe 211–204 vote was a motion to refer the impeachment resolution to the Judiciary Committee, not a final vote to impeach or acquit Hegseth. Referral prevented the articles from advancing to an immediate impeachment vote on the House floor.\n\nThe distinction matters: the House did not issue a verdict on the allegations. It chose a procedural path that left the impeachment effort without sufficient momentum to proceed in the current session.\n\nWHAT COULD HAPPEN IN 2027?\n\nDemocrats are preparing to assume congressional majorities in January 2027 following the midterm elections. Democratic leaders have indicated that they plan closer scrutiny of Hegseth's Pentagon and military decision-making. Whether lawmakers introduce a new impeachment resolution, conduct hearings or pursue other oversight measures remains to be seen.\n\nOn November 13, Axios reported additional discussion among House Democrats about missed votes and floor management following the referral decision. That debate concerns congressional strategy, not a new finding about the impeachment allegations.\n\nWHY THE STORY MATTERS\n\nThe vote illustrates continuing tensions over the balance of power between Congress and the executive branch in decisions about war, military accountability and oversight. Hegseth remains defense secretary, while questions raised by the resolution may continue to be debated through legislative and oversight processes.\n\nAVQN will follow official House actions, Pentagon statements and any new congressional proceedings as they develop.\n\nSOURCES\n\nU.S. House Clerk — Roll Call 317, November 10, 2026:\nhttps://clerk.house.gov/Votes/MemberVotes?CongressNum=119&Session=2nd\n\nReuters — US House votes to derail impeachment of Defense Secretary Hegseth, November 10, 2026:\nhttps://www.reuters.com/world/us/us-house-votes-derail-impeachment-defense-secretary-hegseth-2026-11-10/\n\nU.S. House — Text of Rep. Massie's impeachment resolution:\nhttps://docs.house.gov/billsthisweek/20261109/FILE_1380%20%281%29.pdf\n\nWhite House — Statement of Administration Policy, November 10, 2026:\nhttps://www.whitehouse.gov/wp-content/uploads/2026/11/SAP-Impeachment-Resolution.pdf\n\nCBS News — House blocks Massie's effort to impeach Hegseth, November 10, 2026:\nhttps://www.cbsnews.com/news/massie-hegseth-impeachment/\n\nAxios — House Democratic leaders face fallout over floor vote fumbles, November 13, 2026:\nhttps://www.axios.com/2026/11/13/house-democrats-hegseth-impeachment-vote-jeffries\n\nAletheia Vox Quantum Network (AVQN) | Published November 13, 2026.","image":"/assets/a_dramatic_news_style_editorial_graphic_close_up.png","date":"2026-11-13"}</script><script>const a=JSON.parse(document.getElementById('article-data').textContent),q=id=>document.getElementById(id);q('headline').textContent=a.title;q('category').textContent=a.category;q('summary').textContent=a.summary;q('body').textContent=a.body;q('byline').textContent='AVQN Newsroom · '+new Date(a.date+'T12:00:00').toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});if(a.image){q('image').src=a.image;q('image').alt=a.title;q('image').hidden=false}q('year').textContent=new Date().getFullYear();const u=encodeURIComponent(location.href),t=encodeURIComponent(a.title);q('x').href='https://twitter.com/intent/tweet?text='+t+'&url='+u;q('facebook').href='https://www.facebook.com/sharer/sharer.php?u='+u;q('linkedin').href='https://www.linkedin.com/sharing/share-offsite/?url='+u;q('whatsapp').href='https://api.whatsapp.com/send?text='+t+'%20'+u;q('copy').onclick=()=>navigator.clipboard.writeText(location.href).then(()=>q('copy').textContent='Link copied!');</script></body></html>
