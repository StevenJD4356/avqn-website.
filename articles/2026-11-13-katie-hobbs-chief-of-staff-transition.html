ership during her first term and described Lorick as an experienced public servant equipped to guide the administration through its next phase.\n\nThe Governor's Office identified water security, affordability, border security and public education as continuing priorities. Lorick said she would focus on implementing the governor's agenda, including lowering costs, strengthening the economy and investing in public schools.\n\nThe transition was announced November 12; Campbell's departure and Lorick's assumption of the position are scheduled for the end of November, not effective immediately.\n\nSOURCE: Office of Arizona Governor Katie Hobbs, November 12, 2026\nhttps://azgovernor.gov/office-arizona-governor/news/2026/11/governor-katie-hobbs-announces-chief-staff-transition-appoints\n\nAVQN | Truth • Voice • Impact","image":"/assets/katie-hobbs-chief-of-staff.svg","date":"2026-11-13"}</script><script>const a=JSON.parse(document.getElementById('article-data').textContent),q=id=>document.getElementById(id);q('headline').textContent=a.title;q('category').textContent=a.category;q('summary').textContent=a.summary;q('body').textContent=a.body;q('byline').textContent='AVQN Newsroom · '+new Date(a.date+'T12:00:00').toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});if(a.image){q('image').src=a.image;q('image').alt=a.title;q('image').hidden=false}q('year').textContent=new Date().getFullYear();const u=encodeURIComponent(location.href),t=encodeURIComponent(a.title);q('x').href='https://twitter.com/intent/tweet?text='+t+'&url='+u;q('facebook').href='https://www.facebook.com/sharer/sharer.php?u='+u;q('linkedin').href='https://www.linkedin.com/sharing/share-offsite/?url='+u;q('whatsapp').href='https://api.whatsapp.com/send?text='+t+'%20'+u;q('copy').onclick=()=>navigator.clipboard.writeText(location.href).then(()=>q('copy').textContent='Link copied!');</script></body></html>
