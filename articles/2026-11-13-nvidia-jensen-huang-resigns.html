tive vice president and chief financial officer Colette Kress as interim CEO. Kress will continue serving as CFO while NVIDIA's board searches for a permanent successor.\n\nAccording to NVIDIA's filing with the U.S. Securities and Exchange Commission, the board accepted Huang's resignation on November 11, effective immediately. The company has not publicly provided a reason for his departure in its transition announcement or SEC filing.\n\nSECURITY INVESTIGATION PRECEDED THE RESIGNATION\n\nThe leadership change follows NVIDIA's November 8 statement announcing an independent board investigation after reports that Huang had been targeted by a foreign intelligence effort. The company said independent directors, assisted by outside counsel, would oversee the inquiry.\n\nNVIDIA stated that its board had no reason to believe national security or company secrets had been compromised. The reported foreign-intelligence concerns remain allegations under investigation; the board's announcement did not establish that espionage occurred.\n\nThe company has not confirmed that the investigation was the cause of Huang's resignation. Although the developments occurred within days of each other, a direct causal link should not be assumed.\n\nWHO IS INTERIM CEO COLETTE KRESS?\n\nKress joined NVIDIA in September 2013 and has overseen its finance organization through a period of substantial expansion. Before joining NVIDIA, she held senior finance roles at Cisco and Microsoft, according to the company's announcement.\n\nNVIDIA's board also appointed Harvey C. Jones as its first chair. Jones has served on NVIDIA's board since 1993. The company says its leadership team intends to continue its operations, customer commitments and product roadmap during the transition.\n\nWHAT HAPPENS NEXT?\n\nThe search for a permanent chief executive is underway. NVIDIA is scheduled to report its third-quarter fiscal 2027 financial results on November 17, followed by an investor conference call. That event may offer further insight into how management plans to navigate the transition and maintain its AI technology strategy.\n\nFor NVIDIA, the leadership change comes at a consequential moment for the global AI industry. The company supplies processors and computing infrastructure widely used to develop and operate artificial-intelligence systems. Its next CEO will inherit a business deeply connected to the expansion of AI data centers, software, and advanced computing.\n\nAVQN will continue following official company disclosures, the board's investigation and any developments relevant to investors, technology customers and the broader public.\n\nPRIMARY SOURCES\n\nNVIDIA — CEO transition announcement (November 12, 2026):\nhttps://nvidianews.nvidia.com/news/nvidia-announces-ceo-transition/\n\nNVIDIA Board of Directors — investigation statement (November 8, 2026):\nhttps://investor.nvidia.com/news/press-release-details/2026/Statement-from-NVIDIA-Board-of-Directors/default.aspx\n\nU.S. Securities and Exchange Commission — NVIDIA Form 8-K:\nhttps://www.sec.gov/Archives/edgar/data/1045810/000104581026000082/nvda-20261111.htm\n\nReporting by Aletheia Vox Quantum Network (AVQN). Published November 13, 2026.","image":"/assets/NVIDIA%20Leadership%20Transition_%20AI%20News%20Graphic.png","date":"2026-11-13"}</script><script>const a=JSON.parse(document.getElementById('article-data').textContent),q=id=>document.getElementById(id);q('headline').textContent=a.title;q('category').textContent=a.category;q('summary').textContent=a.summary;q('body').textContent=a.body;q('byline').textContent='AVQN Newsroom · '+new Date(a.date+'T12:00:00').toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});if(a.image){q('image').src=a.image;q('image').alt=a.title;q('image').hidden=false}q('year').textContent=new Date().getFullYear();const u=encodeURIComponent(location.href),t=encodeURIComponent(a.title);q('x').href='https://twitter.com/intent/tweet?text='+t+'&url='+u;q('facebook'
