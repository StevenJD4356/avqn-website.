-wrap:wrap;margin:35px 0}.share a,.share button{border:1px solid #bd9651;background:#12273d;color:#f3d99b;padding:10px 15px;font:700 13px system-ui;cursor:pointer;text-decoration:none;border-radius:4px}footer{border-top:1px solid #5c4b30;padding:30px 20px;text-align:center;color:#acbbca}</style></head><body><header><a href="/">AVQN · TRUTH HAS VOICE</a> &nbsp; <a href="/news.html">NEWSROOM</a></header><main><div class="category" id="category"></div><h1 id="headline"></h1><div class="byline" id="byline"></div><img class="hero" id="image" hidden alt=""><p class="summary" id="summary"></p><article class="body" id="body"></article><div class="share"><button id="copy">Copy article link</button><a id="x" target="_blank" rel="noopener">Share on X</a><a id="facebook" target="_blank" rel="noopener">Facebook</a><a id="linkedin" target="_blank" rel="noopener">LinkedIn</a><a id="whatsapp" target="_blank" rel="noopener">WhatsApp</a></div><a href="/news.html">← More AVQN stories</a></main><footer>© <span id="year"></span> Aletheia Vox Quantum Network · Truth • Voice • Impact</footer><script id="article-data" type="application/json">{"slug":"2026-11-13-usman-nurmagomedov-abu-dhabi-prison-sentences","title":"Usman Nurmagomedov Reportedly Among Those Sentenced After Abu Dhabi Hotel Brawl","category":"Combat Sports","summary":"An Abu Dhabi court convicted 10 defendants after a brawl involving Usman Nurmagomedov and Merab Dvalishvili. Reports identify Nurmagomedov among those receiving six-month prison sentences.","body":"ABU DHABI, UNITED ARAB EMIRATES — An Abu Dhabi court has convicted 10 defendants following a hotel brawl involving mixed martial artists Usman Nurmagomedov, Merab Dvalishvili and members of their teams ahead of a Real American Freestyle (RAF) wrestling event.\n\nAccording to Reuters, the Abu Dhabi Judicial Department announced on Friday, November 13, that defendants in the hotel-brawl case received six-month prison sentences and deportation orders. Separate media reports, including MMA Junkie, identify Usman Nurmagomedov among six members of his team sentenced to six months in prison and fined 300,000 UAE dirhams each, approximately $81,600. Reuters reported that it had sought confirmation from Abu Dhabi authorities and Nurmagomedov's representatives regarding those individual details.\n\nWHAT HAPPENED AT THE HOTEL?\n\nThe confrontation took place Wednesday, November 11, at a hotel in Abu Dhabi. Video circulated online appeared to show Nurmagomedov approaching Dvalishvili during an interview and slapping him, followed by a wider fight involving people from both groups.\n\nAbu Dhabi Police previously said they arrested eight people in connection with the fight and two additional people accused of filming the incident. The court proceedings followed those arrests.\n\nSENTENCES, FINES AND PRIVACY VIOLATIONS\n\nReuters reported that Dvalishvili and his teammate Saba Lazishvili were fined 50,000 dirhams each and released. Other reporting described separate six-month sentences for two people accused of recording the confrontation and distributing footage online, raising additional legal issues under local privacy laws.\n\nThe official court announcement confirms convictions and prison penalties in the case, while news outlets have supplied additional reporting about individual defendants, fines and releases. The distinction matters because the public court announcement cited by Reuters did not identify every defendant by name.\n\nRAF EVENT CARD CHANGES\n\nThe incident disrupted preparations for RAF Abu Dhabi. Event organizers removed Umar Nurmagomedov, Usman's brother, from the card and named Lazishvili as his replacement for a scheduled match against Urijah Faber. Dvalishvili remained scheduled to compete against Marlon Moraes.\n\nRAF co-founder Chad Bronstein had previously said Usman Nurmagomedov would not be permitted to attend the event following the altercation.\n\nRESPONSE FROM NURMAGOMEDOV'S CAMP\n\nUsman's manager, Ali Abdelaziz, apologized publicly for the incident in comments reported by MMA media. He described the confrontation as unacceptable and said the team needed to conduct itself better. His comments preceded the latest court reporting.\n\nWHAT THIS MEANS FOR THE FIGHTERS\n\nThe prison sentences, reported fines and deportation orders could have serious implications for the people involved. Questions also remain about how the developments may affect Usman Nurmagomedov's future in professional MMA. No final determination about future UFC or other promotional contracts should be inferred from the court ruling alone.\n\nFight Dispatch MMA and Aletheia Vox Quantum Network will continue following any official clarification of the individual judgments, legal appeals, changes to the RAF event and responses from the fighters' representatives.\n\nSOURCES\n\nReuters, November 13, 2026 — Several jailed over Abu Dhabi hotel brawl ahead of RAF event:\nhttps://www.reuters.com/world/middle-east/several-jailed-over-abu-dhabi-hotel-brawl-ahead-raf-event-2026-11-13/\n\nMMA Junkie via Yahoo Sports, November 13, 2026 — Usman Nurmagomedov, team members get Abu Dhabi prison sentences after brawl:\nhttps://sports.yahoo.com/articles/usman-nurmagomedov-team-members-abu-132925379.html\n\nSherdog, November 13, 2026 — Usman Nurmagomedov barred from RAF Abu Dhabi following hotel brawl:\nhttps://www.sherdog.com/news/news/Usman-Nurmagomedov-barred-from-RAF-Abu-Dhabi-following-hotel-brawl-203605\n\nMMA Fighting, November 13, 2026 — Merab Dvalishvili still competing at RAF Abu Dhabi:\nhttps://www.mmafighting.com/raf-wrestling/520878/merab-dvalishvili-still-competing-at-raf-abu-dhabi-saba-lazishvili-also-added-to-card-after-usman-nurmagomedov-attack\n\nPublished November 13, 2026 | Fight Dispatch MMA coverage, powered by AVQN.","image":"/assets/avqn-logo.png","date":"2026-11-13"}</script><script>const a=JSON.parse(document.getElementById('article-data').textContent),q=id=>document.getElementById(id);q('headline
