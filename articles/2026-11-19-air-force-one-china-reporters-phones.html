"></div><h1 id="headline"></h1><div class="byline" id="byline"></div><img class="hero" id="image" hidden alt=""><p class="summary" id="summary"></p><article class="body" id="body"></article><div class="share"><button id="copy">Copy article link</button><a id="x" target="_blank" rel="noopener">Share on X</a><a id="facebook" target="_blank" rel="noopener">Facebook</a><a id="linkedin" target="_blank" rel="noopener">LinkedIn</a><a id="whatsapp" target="_blank" rel="noopener">WhatsApp</a></div><a href="/news.html">← More AVQN stories</a></main><footer>© <span id="year"></span> Aletheia Vox Quantum Network · Truth • Voice • Impact</footer><script id="article-data" type="application/json">{"slug":"2026-11-19-air-force-one-china-reporters-phones","title":"Reporters Asked to Secure China-Used Phones in Faraday Bags on Air Force One","category":"White House & Press Freedom","summary":"A White House press pool account describes a cybersecurity precaution during the flight from China, with journalists asked to secure devices used during the visit.","date":"2026-11-19","image":"/assets/ChatGPT%20Image%20Nov%2021%2C%202026%2C%2009_07_17%20PM.png","body":"November 19, 2026 — Journalists traveling aboard Air Force One after President Donald Trump's visit to China were asked to place phones they had used in China into signal-blocking Faraday bags until the aircraft returned to the United States, according to accounts from the White House press pool.\n\nCBS News journalist Jennifer Jacobs described the procedure in a pool explanation shared publicly by CNN's Kaitlan Collins. The account said an Air Force One aide separately collected temporary phones used by White House staff for disposal or data wiping. Journalists' China-used devices were to be returned after landing.\n\nThe account also noted that many reporters had protected their regular work phones and other devices before arriving in China, leaving those devices available during the return flight. The restrictions did not mean that every journalist lost access to every phone.\n\nNBC News correspondent Gabe Gutierrez said he asked Trump about the precaution. Trump cited a desire to be careful but did not provide a detailed explanation.\n\nThe reported precaution was framed as a cybersecurity measure; the available reporting does not establish that any particular reporter's device was infected or compromised.\n\nSources:\nMediaite, Kathianne Boniello (November 19, 2026): https://www.mediaite.com/media/news/trump-pressed-on-why-reporters-phones-were-confiscated-on-china-trip/\nThe Hill, Mallory Wilson (November 19, 2026): https://www.aol.com/articles/white-house-takes-phones-reporters-152850000.html"}</script><script>const a=JSON.parse(document.getElementById('article-data').textContent),q=id=>document.getElementById(id);q('headline').textContent=a.title;q('category').textContent=a.category;q('summary').textContent=a.summary;q('body').textContent=a.body;q('byline').textContent='AVQN Newsroom · '+new Date(a.date+'T12:00:00').toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});if(a.image){q('image').src=a.image;q('image').alt=a.title;q('image').hidden=false}q('year').textContent=new Date().getFullYear();const u=encodeURIComponent(location.href),t=encodeURIComponent(a.title);q('x').href='https://twitter.com/intent/tweet?text='+t+'&url='+u;q('facebook').href='https://www.facebook.com/sharer/sharer.php?u='+u;q('linkedin').href='https://www.linkedin.com/sharing/share-offsite/?url='+u;q('whatsapp').href='https://api.whatsapp.com/send?text='+t+'%20'+u;q('copy').onclick=()=>navigator.clipboard.writeText(location.href).then(()=>q('copy').textContent='Link copied!');</script></body></html>
