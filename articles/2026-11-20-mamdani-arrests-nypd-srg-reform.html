"></h1><div class="byline" id="byline"></div><img class="hero" id="image" hidden alt=""><p class="summary" id="summary"></p><article class="body" id="body"></article><div class="share"><button id="copy">Copy article link</button><a id="x" target="_blank" rel="noopener">Share on X</a><a id="facebook" target="_blank" rel="noopener">Facebook</a><a id="linkedin" target="_blank" rel="noopener">LinkedIn</a><a id="whatsapp" target="_blank" rel="noopener">WhatsApp</a></div><a href="/news.html">← More AVQN stories</a></main><footer>© <span id="year"></span> Aletheia Vox Quantum Network · Truth • Voice • Impact</footer><script id="article-data" type="application/json">{"slug":"2026-11-20-mamdani-arrests-nypd-srg-reform","title":"Mamdani's Past Protest Arrests Draw Attention as NYC Disbands NYPD Strategic Response Group","category":"U.S. Politics & Policing","summary":"New York City has announced the disbandment of the NYPD Strategic Response Group, while reporting has highlighted Mayor Mamdani's earlier encounters with its officers.","date":"2026-11-20","image":"/assets/avqn-mamdani-nypd-srg.png","body":"November 20, 2026 — New York City Mayor Zohran Mamdani and Police Commissioner Jessica Tisch announced on November 16 that the NYPD would disband its Strategic Response Group (SRG), a unit whose responsibilities included protest response and counterterrorism deployments.\n\nReporting and archival images have drawn renewed attention to Mamdani's own arrests during protests in 2021 and 2024, when officers identified as members of the SRG were involved. The mayor's previous arrests do not, by themselves, establish that the restructuring was motivated by personal retaliation.\n\nAccording to the mayor's office, counterterrorism responsibilities are being consolidated within the NYPD's Intelligence and Counterterrorism Bureau. The city is also establishing new crowd-management and dialogue structures, including a civilian-led Community Dialogue and De-escalation Division and a First Amendment Support Team.\n\nSupporters describe the changes as an effort to protect protest rights and improve de-escalation. Critics have raised questions about how the restructuring will affect public safety and whether replacement units will change police practices in substance.\n\nSources:\nNYC Mayor's Office, official announcement (November 16, 2026): https://www.nyc.gov/mayors-office/news/2026/11/mayor-mamdani_and-police-commissionertischdisbandnypd-s-strategi\nReuters, reporting on SRG restructuring (November 16, 2026): https://www.reuters.com/world/us/new-york-mayor-mamdani-disbands-notorious-police-unit-that-used-excessive-force-2026-11-16/\nNBC New York, Andrew Siff and Jennifer Millman (November 16, 2026): https://www.nbcnewyork.com/news/local/mamdani-tisch-disband-nypd-strategic-response-group/6572816/"}</script><script>const a=JSON.parse(document.getElementById('article-data').textContent),q=id=>document.getElementById(id);q('headline').textContent=a.title;q('category').textContent=a.category;q('summary').textContent=a.summary;q('body').textContent=a.body;q('byline').textContent='AVQN Newsroom · '+new Date(a.date+'T12:00:00').toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});if(a.image){q('image').src=a.image;q('image').alt=a.title;q('image').hidden=false}q('year').textContent=new Date().getFullYear();const u=encodeURIComponent(location.href),t=encodeURIComponent(a.title);q('x').href='https://twitter.com/intent/tweet?text='+t+'&url='+u;q('facebook').href='https://www.facebook.com/sharer/sharer.php?u='+u;q('linkedin').href='https://www.linkedin.com/sharing/share-offsite/?url='+u;q('whatsapp').href='https://api.whatsapp.com/send?text='+t+'%20'+u;q('copy').onclick=()=>navigator.clipboard.writeText(location.href).then(()=>q('copy').textContent='Link copied!');</script></body></html>
