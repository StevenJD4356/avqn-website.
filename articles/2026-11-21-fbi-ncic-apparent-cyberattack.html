div class="byline" id="byline"></div><img class="hero" id="image" hidden alt=""><p class="summary" id="summary"></p><article class="body" id="body"></article><div class="share"><button id="copy">Copy article link</button><a id="x" target="_blank" rel="noopener">Share on X</a><a id="facebook" target="_blank" rel="noopener">Facebook</a><a id="linkedin" target="_blank" rel="noopener">LinkedIn</a><a id="whatsapp" target="_blank" rel="noopener">WhatsApp</a></div><a href="/news.html">← More AVQN stories</a></main><footer>© <span id="year"></span> Aletheia Vox Quantum Network · Truth • Voice • Impact</footer><script id="article-data" type="application/json">{"slug":"2026-11-21-fbi-ncic-apparent-cyberattack","title":"FBI Investigates Apparent Cyberattack Targeting National Crime Information Center","category":"Cybersecurity & National Security","summary":"Federal investigators are examining a reported intrusion involving the NCIC database. The scope and any potential exposure of records remain unclear.","date":"2026-11-21","image":"/assets/avqn-fbi-ncic-cyberattack.png","body":"November 21, 2026 — The FBI is investigating an apparent intrusion targeting the National Crime Information Center (NCIC), the nationwide criminal justice database used by law enforcement agencies to access information on fugitives, missing people, stolen property and other records.\n\nAssociated Press journalist Eric Tucker reported that a person familiar with the matter confirmed the investigation. The FBI declined to comment publicly. ABC News journalists Nicholas Kerr and Luke Barr also reported confirmation from a law enforcement source.\n\nPresident Donald Trump, asked about the reports in a Fox News interview, said he had just heard about the incident and described it as “not good.”\n\nAs of this report, authorities have not publicly established who was responsible, the extent of any access, or whether sensitive information was copied or altered. An investigation into an apparent hack should not be taken as proof that the entire database was compromised.\n\nSources:\nAssociated Press, Eric Tucker (November 21, 2026): https://apnews.com/article/d066cff87a64a564db0a00172c124972\nABC News, Nicholas Kerr and Luke Barr (November 21, 2026): https://abcnews.com/US/fbis-national-crime-database-targeted-hack-trump/story?id=138347810"}</script><script>const a=JSON.parse(document.getElementById('article-data').textContent),q=id=>document.getElementById(id);q('headline').textContent=a.title;q('category').textContent=a.category;q('summary').textContent=a.summary;q('body').textContent=a.body;q('byline').textContent='AVQN Newsroom · '+new Date(a.date+'T12:00:00').toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});if(a.image){q('image').src=a.image;q('image').alt=a.title;q('image').hidden=false}q('year').textContent=new Date().getFullYear();const u=encodeURIComponent(location.href),t=encodeURIComponent(a.title);q('x').href='https://twitter.com/intent/tweet?text='+t+'&url='+u;q('facebook').href='https://www.facebook.com/sharer/sharer.php?u='+u;q('linkedin').href='https://www.linkedin.com/sharing/share-offsite/?url='+u;q('whatsapp').href='https://api.whatsapp.com/send?text='+t+'%20'+u;q('copy').onclick=()=>navigator.clipboard.writeText(location.href).then(()=>q('copy').textContent='Link copied!');</script></body></html>
