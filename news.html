<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AVQN Newsroom | Latest Articles</title><meta name="description" content="Latest articles, interviews, politics and global reporting from Aletheia Vox Quantum Network"><style>*{box-sizing:border-box}body{margin:0;background:#06101f;color:#f4f0e6;font:16px/1.6 system-ui}header{padding:22px max(20px,calc((100vw - 1150px)/2));border-bottom:1px solid #ad884b;background:#091c32}a{color:#e7c57d}header a{font-weight:800;text-decoration:none}main{max-width:1150px;margin:auto;padding:70px 22px}h1{font:700 clamp(43px,7vw,80px) Georgia,serif;margin:8px 0 16px}.eyebrow{font-size:12px;color:#d9b36b;letter-spacing:.2em;font-weight:800}.lead{color:#b9c8d8;font-size:19px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px;margin-top:40px}.card{display:block;background:#0e2339;border:1px solid #a98a5055;text-decoration:none;color:inherit;overflow:hidden}.card img{width:100%;height:190px;object-fit:cover;display:block}.card .copy{padding:23px}.card h2{font:700 26px/1.2 Georgia,serif;margin:12px 0}.card p{color:#c0ccda}.card small{color:#e0bb75}footer{padding:30px;text-align:center;color:#9fb2c4}</style></head><body><header><a href="/">AVQN / HOME</a></header><main><div class="eyebrow">TRUTH · VOICE · IMPACT</div><h1>THE NEWSROOM.</h1><p class="lead">Independent reporting, world affairs, politics, interviews and original AVQN coverage.</p><div id="grid" class="grid"></div><p id="empty" hidden>Our first articles are coming soon.</p></main><footer>© Aletheia Vox Quantum Network</footer><script>fetch('/articles.json',{cache:'no-store'}).then(r=>r.json()).then(items=>{const grid=document.getElementById('grid');document.getElementById('empty').hidden=items.length>0;items.sort((a,b)=>b.date.localeCompare(a.date)).forEach(a=>{const link=document.createElement('a');link.className='card';link.href='/articles/'+encodeURIComponent(a.slug)+'.html';if(a.image){const img=document.createElement('img');img.src=a.image;img.alt=a.title;img.loading='lazy';link.append(img)}const d=document.createElement('div');d.className='copy';const meta=document.createElement('small');meta.textContent=a.category+' · '+a.date;const h=document.createElement('h2');h.textContent=a.title;const p=document.createElement('p');p.textContent=a.summary;d.append(meta,h,p);link.append(d);grid.append(link)})}).catch(()=>document.getElementById('empty').hidden=false)</script></body></html>
